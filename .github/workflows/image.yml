# Baut das php-Image nativ für Intel/AMD und Apple Silicon (ARM64)
# und veröffentlicht das Multi-Arch-Image in der GitHub Container Registry
# (ghcr.io/<konto>/immoverwalt-php).
name: Image bauen

on:
  push:
    branches: [main]
    paths:
      - "docker/php/**"
      - "composer.json"
      - "composer.lock"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v7

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v4

      - name: Bei GitHub Container Registry anmelden
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image-Name in Kleinbuchstaben
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/immoverwalt-php" >> "$GITHUB_ENV"

      - name: Nativ nach Digest bauen und pushen
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/php/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=PHP-FPM Image für ImmoVerwalt (Symfony 4.4 / PHP 7.4)

      - name: Digest exportieren
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Digest hochladen
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Multi-Arch-Manifest zusammenführen
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Digests herunterladen
        uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-artifacts: true

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v4

      - name: Bei GitHub Container Registry anmelden
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image-Name in Kleinbuchstaben
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/immoverwalt-php" >> "$GITHUB_ENV"

      - name: Manifest-Liste erstellen und pushen
        run: |
          cd "${{ runner.temp }}/digests"
          images=$(find . -type f -exec basename {} \; | sort -u | xargs -I{} printf '${{ env.IMAGE }}@sha256:%s ' {})
          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            $images

      - name: Manifest überprüfen
        run: |
          docker buildx imagetools inspect "${IMAGE}:latest"

security:
    encoders:
        App\Entity\User:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username

    role_hierarchy:
        ROLE_ADMIN: [ROLE_PROPERTY_MANAGER, ROLE_LETTING_MANAGER]
        ROLE_PROPERTY_MANAGER: [ROLE_USER]
        ROLE_LETTING_MANAGER: [ROLE_USER]

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            anonymous: lazy
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: dashboard
                csrf_token_generator: security.csrf.token_manager
            logout:
                path: app_logout
                target: app_login

    access_control:
        - { path: ^/login, roles: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/verwaltung, roles: ROLE_ADMIN }
        - { path: ^/, roles: ROLE_USER }

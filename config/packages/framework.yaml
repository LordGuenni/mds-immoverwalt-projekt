framework:
    secret: '%env(APP_SECRET)%'
    default_locale: de
    csrf_protection: true
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
    php_errors:
        log: true
    router:
        utf8: true
    translator:
        default_path: '%kernel.project_dir%/translations'
        fallbacks: ['de']
    validation:
        enable_annotations: true
